name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Python 3.12 backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DEMO_DATA_ENABLED: "false"
      AI_API_KEY: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      DATABASE_URL: ""
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install locked runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify dependency compatibility
        run: python -m pip check

      - name: Run backend tests
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: backend/test-results.xml
          if-no-files-found: ignore
          retention-days: 7
